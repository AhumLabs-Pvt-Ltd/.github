name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Do not paste real ship, client or crew data, or any secrets.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm install`
        2. Run `pnpm test`
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `pnpm doctor` if the repository has it, or your OS, Node and pnpm versions.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This report contains no real ship, client or crew data, and no secrets.
          required: true
